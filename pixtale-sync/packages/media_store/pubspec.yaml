name: media_store
description: Batch MediaStore filename and size lookups for Android photo scan.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.13.7
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.pixtale.media_store
        pluginClass: MediaStoreQueryPlugin
